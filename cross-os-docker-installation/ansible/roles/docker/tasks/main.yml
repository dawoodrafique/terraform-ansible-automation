---
# tasks file for roles/docker
- name: Import and Setup Other Tasks
  include_tasks: "{{ ansible_distribution | lower }}_spec_tasks.yml"


- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes
  become: true
  notify: Start Docker


- name: Wait for Docker to be ready
  wait_for:
    path: /var/run/docker.sock
    timeout: 30
  become: true

- name: Create Docker User Group And Update
  user:
    name: "{{ item }}"
    groups: docker 
    append: yes
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
  notify: Restart Docker


- name: Verify Docker is Running
  command: docker --version
  changed_when: false
  register: docker_version

- name: Log Docker Version
  debug:
    msg: "Docker version: {{ docker_version.stdout }}"

- name: List running containers
  command: docker ps
  register: docker_ps_output
  become: true
  changed_when: false
  failed_when: false

- name: Display running containers
  debug:
    msg: "Running containers: {{ docker_ps_output.stdout_lines | default(['None']) }}"